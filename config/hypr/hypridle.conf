# #######################################################################################
# HYPRIDLE CONFIGURATION
# #######################################################################################

general {
    lock_cmd = pidof hyprlock || hyprlock       # dbus/sysd lock command
    before_sleep_cmd = loginctl lock-session    # lock before suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # turn on display after sleep
    ignore_dbus_inhibit = false                 # respect DBus idle-inhibit requests (Steam, games, video playback)
    ignore_systemd_inhibit = false              # respect systemd idle inhibitors
}

# 2.5 min: dim display backlight
listener {
    timeout = 150
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

# 5 min: lock screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 min: turn off display
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
