# #######################################################################################
# CYBRSPACE // HYPRLOCK CONFIGURATION
# #######################################################################################

# Background
background {
    monitor =
    path = /home/cyberdev/Pictures/Wallpapers/Retro_Terminal_Workstation.png
    color = rgba(40, 40, 40, 1.0)
    blur_passes = 2
    blur_size = 6
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# Input Field
input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.25 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(fabd2f) # Gruvbox Yellow
    inner_color = rgb(3c3836) # Gruvbox bg1
    font_color = rgb(ebdbb2) # Gruvbox fg
    fade_on_empty = false
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <span foreground="##a89984">Enter Password...</span> # Gruvbox Gray
    hide_input = false
    rounding = 12
    check_color = rgb(fe8019) # Gruvbox Orange
    fail_color = rgb(fb4934) # Gruvbox Red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    fail_timeout = 2000
    fail_transition = 300
    capslock_color = rgb(fabd2f)
    position = 0, -80
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(ebdbb2)
    font_size = 90
    font_family = JetBrainsMono Nerd Font Bold, sans-serif
    position = 0, 100
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(29, 32, 33, 0.6)
}

# Date
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d, %Y")"
    color = rgb(fabd2f) # Gruvbox Yellow
    font_size = 22
    font_family = JetBrainsMono Nerd Font, sans-serif
    position = 0, 20
    halign = center
    valign = center
}

# User Greeting
label {
    monitor =
    text = Welcome back, $USER
    color = rgb(d5c4a1)
    font_size = 16
    font_family = JetBrainsMono Nerd Font, sans-serif
    position = 0, -20
    halign = center
    valign = center
}
